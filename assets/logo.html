<!doctype html>
<!--
  Sorgente del logo: logo-light.png e logo-dark.png si rigenerano da qui.
  ?theme=dark mostra la variante scura.

  Come esportare: aprire il file nel browser, DevTools -> ispezionare il nodo .logo ->
  "Capture node screenshot" (menu contestuale). Il ritaglio segue il riquadro .logo, quindi
  la dimensione finale si adatta al contenuto e lo sfondo resta trasparente.
-->
<meta charset="utf-8">
<title>OpenAPI Visual Editor — logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101418;
    --muted: #5b6570;
    --accent: #0b63ce;
    --accent-2: #3d95f0;
    --mark-ink: #ffffff;
  }
  body.dark {
    --ink: #e9eff6;
    --muted: #8b98a5;
    --accent: #58a6ff;
    --accent-2: #7cc4ff;
    --mark-ink: #0b1017;
  }
  html, body { margin: 0; background: transparent; }
  body { display: flex; align-items: flex-start; }

  .logo {
    display: flex; align-items: center; gap: 34px;
    padding: 30px 34px;
    font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Il segno: una specifica che diventa interfaccia — graffe con dentro tre righe
     strutturate, la centrale evidenziata come se fosse la riga in modifica. */
  .mark {
    width: 104px; height: 104px; border-radius: 26px; flex: none;
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .brace { font-size: 44px; font-weight: 500; color: var(--mark-ink); opacity: 0.8; line-height: 1; }
  .rows { display: flex; flex-direction: column; gap: 7px; }
  .rows i { display: block; height: 7px; border-radius: 4px; background: var(--mark-ink); opacity: 0.55; }
  .rows i:nth-child(1) { width: 26px; }
  .rows i:nth-child(2) { width: 34px; opacity: 1; }
  .rows i:nth-child(3) { width: 20px; margin-left: 8px; }

  .word { display: flex; flex-direction: column; gap: 12px; }
  .name { font-size: 56px; line-height: 1; letter-spacing: -0.025em; color: var(--ink); font-weight: 700; white-space: nowrap; }
  .name em { font-style: normal; font-weight: 500; color: var(--accent); }
  .tag {
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 15px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
</style>
<div class="logo">
  <div class="mark">
    <span class="brace">{</span>
    <span class="rows"><i></i><i></i><i></i></span>
    <span class="brace">}</span>
  </div>
  <div class="word">
    <div class="name">OpenAPI <em>Visual Editor</em></div>
    <div class="tag">il file non lascia il browser</div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.body.classList.add('dark')
</script>
