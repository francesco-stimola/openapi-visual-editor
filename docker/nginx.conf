# Configurazione di nginx per l'immagine Docker: sostituisce /etc/nginx/conf.d/default.conf.
# Serve solo file statici — non c'è nessun backend a cui fare da proxy.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Il bundle è grosso (il solo @apitomy/data-models supera i 4 MB): senza compressione
    # il primo caricamento trasferirebbe qualche volta tanto di quanto serve.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;

    # Attenzione: in nginx un add_header in un blocco figlio ANNULLA quelli ereditati dal
    # padre. Per questo le intestazioni comuni sono ripetute in ogni location che ne aggiunge
    # di proprie, invece di essere dichiarate una volta sola qui.
    # Nessuna Content-Security-Policy: la vista "Source" dell'editor carica Monaco da
    # cdn.jsdelivr.net e una policy restrittiva la romperebbe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "no-referrer" always;

    # Gli asset generati da Vite hanno l'hash del contenuto nel nome: cambiano nome quando
    # cambia il contenuto, quindi possono essere messi in cache per sempre.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "no-referrer" always;
        add_header Cache-Control         "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html invece no: è l'unico file che riferisce gli hash, e una copia vecchia in
    # cache continuerebbe a chiedere gli asset della versione precedente.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "no-referrer" always;
        add_header Cache-Control         "no-cache" always;
    }

    # Nessun fallback a index.html: l'applicazione è una pagina sola, senza router lato
    # client, quindi un percorso inesistente è davvero un 404 e non va mascherato.
    location / {
        try_files $uri $uri/ =404;
    }
}
