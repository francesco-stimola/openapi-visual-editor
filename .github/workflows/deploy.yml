name: Deploy to GitHub Pages

# Rilascio: pubblica dist/ su GitHub Pages SOLO quando viene creato un tag `v*.*.*`, e crea la
# release GitHub corrispondente. Il push su main non pubblica più nulla (lo verifica soltanto:
# ci.yml), così main resta un ramo di lavoro e ogni pubblicazione corrisponde a una versione
# tracciabile.
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# Prerequisito una tantum, non automatizzabile: Settings -> Pages -> Source: GitHub Actions
# (il GITHUB_TOKEN non può creare il sito Pages, vedi il commento in build.yml).
#
# `workflow_dispatch` resta come via di fuga per ripubblicare a mano il SOLO sito (Actions ->
# "Deploy to GitHub Pages" -> "Run workflow"): non crea alcuna release, perché una release senza
# tag non esiste, e non tocca né il pacchetto scaricabile né l'immagine Docker, che esistono solo
# in funzione di una versione. Attenzione: l'ambiente `github-pages` ammette solo i ref elencati
# nelle sue deployment rules; oggi c'è il solo `v*.*.*` (tag), quindi un'esecuzione manuale da
# `main` verrebbe rifiutata finché non si aggiunge anche una regola di branch per `main`.
# Per la sola verifica di un branch, senza pubblicare, usare "Manual build".
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Minimo privilegio a livello di workflow: scrittura su Pages e sui contenuti è concessa solo
# ai job che ne hanno davvero bisogno.
permissions:
  contents: read

# Un solo deploy per volta. cancel-in-progress: false perché interrompere una pubblicazione
# a metà lascerebbe il sito in uno stato indeterminato.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Guardie di rilascio: un tag che il CHANGELOG non descrive, o che non coincide con la versione
  # dichiarata dal pacchetto, non deve pubblicare. Girano PRIMA della build, così un rilascio
  # incoerente non arriva nemmeno a toccare il sito.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La versione mostrata nel footer dell'applicazione viene da package.json (vedi il define
      # in vite.config.js): se divergesse dal tag, il sito pubblicato dichiarerebbe una versione
      # che non esiste e il link alle note di rilascio porterebbe a una pagina inesistente.
      - name: La versione del pacchetto deve coincidere con il tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(jq -r .version package.json)"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::package.json dichiara la versione $declared, ma il tag è $GITHUB_REF_NAME."
            echo "Allineare \"version\" a $tagged e rifare il tag prima di ripubblicare."
            exit 1
          fi
          echo "OK: package.json e $GITHUB_REF_NAME dichiarano entrambi $declared."

      # Estrae la sezione "## [x.y.z]" corrispondente al tag e la usa come corpo della release.
      # Dipende solo dall'ordine delle sezioni (dalla più recente), non dalla loro numerazione.
      - name: Il CHANGELOG deve descrivere questo rilascio
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-body.md
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::CHANGELOG.md non ha una sezione per $GITHUB_REF_NAME."
            echo "Aggiungere una voce '## [$version] — AAAA-MM-GG' prima di ripubblicare il tag."
            exit 1
          fi
          # In coda alla sezione del changelog: i tre modi di usare questa versione (il sito,
          # l'immagine Docker, il pacchetto allegato qui sotto) e il rimando al changelog
          # completo, che al tag conserva anche la storia delle versioni precedenti.
          # I nomi dei package su GHCR sono minuscoli, mentre GITHUB_REPOSITORY conserva le
          # maiuscole del nome scelto su GitHub: senza il tr, il comando suggerito potrebbe
          # non funzionare.
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo
            echo "---"
            echo
            echo "### Come si usa questa versione"
            echo
            echo "- **Online**, senza installare niente: <https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/>"
            echo "- **Con Docker**: \`docker run --rm -p 8080:80 ${image}:${version}\`"
            echo "- **Sul tuo server**: scarica \`openapi-visual-editor-${version}-dist.zip\` qui sotto e servi la cartella con un qualunque server statico. \`SHA256SUMS\` ne verifica l'integrità."
            echo
            echo "📓 [Changelog completo](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) · [Sito pubblicato](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/)"
          } >> release-body.md
          echo "OK: CHANGELOG.md descrive $GITHUB_REF_NAME ($(wc -l < release-body.md) righe)."

      - name: Upload release body
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-body
          path: release-body.md
          retention-days: 1

  build:
    # Stesso workflow usato da CI e dalla build manuale: il pacchetto pubblicato è prodotto
    # esattamente dagli stessi passi già verificati su main.
    needs: changelog
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      pages-artifact: true

  # Pacchetto scaricabile: la stessa applicazione, ricompilata con base path relativo ("./")
  # invece di "/<repository>/". È ciò che rende la dist servibile da qualunque percorso, e
  # quindi utile a chi la ospita per conto proprio: la dist di Pages funzionerebbe solo sotto
  # l'indirizzo di Pages. Stesso build.yml del sito, nessun passo duplicato.
  package:
    needs: changelog
    # Solo su tag: un'esecuzione manuale ripubblica il sito e nient'altro (vedi in testa).
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      pages-artifact: false
      base-path: ./
      artifact-name: dist-portable
      # Serve solo a passare la dist al job `release`, qualche minuto più tardi.
      retention-days: 1

  # Immagine Docker su GHCR. `needs: changelog` e non `needs: deploy`: l'immagine è un canale
  # di distribuzione indipendente dal sito, e farla aspettare Pages allungherebbe il rilascio
  # senza proteggere da nulla. Resta comunque soggetta alle stesse guardie di coerenza fra tag,
  # package.json e CHANGELOG. Se Pages fallisse dopo il push dell'immagine, la release non
  # verrebbe creata (vedi `release`) e basterebbe ristaccare il tag dopo aver corretto.
  docker:
    needs: changelog
    # Idem: senza questa guardia un'esecuzione manuale da main pubblicherebbe su GHCR
    # un'immagine taggata "main", che non corrisponde ad alcuna versione rilasciata.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # La release è l'ultimo passo perché è la pagina che annuncia tutto il resto: esiste solo se
  # il sito è andato davvero online (`deploy`), se il pacchetto è stato compilato (`package`)
  # e se l'immagine è su GHCR (`docker`).
  release:
    name: release
    needs: [deploy, package, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # L'unico privilegio in più dell'intero workflow: creare la release.
    permissions:
      contents: write
    steps:
      # Il checkout serve solo per allegare LICENSE al pacchetto, e va fatto PRIMA dei
      # download: actions/checkout ripulisce la workspace e cancellerebbe gli artifact.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-body

      - uses: actions/download-artifact@v8
        with:
          name: dist-portable
          path: pacchetto/dist

      # Uno zip con dentro una sola cartella (non si sparpaglia scompattandolo), la licenza e
      # due righe di istruzioni. LICENSE e il rimando al sorgente non sono un vezzo: qui si
      # distribuisce codice compilato sotto AGPL, che dev'essere accompagnato dall'offerta
      # del sorgente corrispondente.
      - name: Prepara il pacchetto scaricabile
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="openapi-visual-editor-${version}"
          mv pacchetto/dist "pacchetto/${name}"
          cp LICENSE "pacchetto/${name}/LICENSE"
          cat > "pacchetto/${name}/LEGGIMI.txt" <<TXT
          OpenAPI Visual Editor ${version}
          Editor visuale per specifiche Swagger 2.0 e OpenAPI 3.x, interamente lato browser.

          Questa cartella è l'applicazione già compilata: soli file statici, nessun backend,
          niente Node.js da installare. La specifica che apri resta nel tuo browser.

          COME SI SERVE — un modo qualsiasi va bene, per esempio:
              npx serve .
              python3 -m http.server 8000
          oppure copiando la cartella nella document root di nginx, Apache o IIS.

          I riferimenti agli asset sono relativi, quindi l'applicazione funziona anche da un
          sottopercorso (https://esempio.it/strumenti/openapi/), non solo dalla radice.
          Aprire index.html con un doppio clic (file://) invece NON funziona: i browser
          rifiutano i moduli JavaScript caricati da file://, serve un server HTTP.

          Unica richiesta di rete dell'applicazione: la vista "Source" scarica l'editor Monaco
          da cdn.jsdelivr.net al primo utilizzo. La specifica non viene comunque inviata.

          Licenza: AGPL-3.0-or-later, vedi il file LICENSE.
          Sorgente completo di questa versione:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}
          TXT
          (cd pacchetto && zip -qr "../${name}-dist.zip" "${name}")
          # Nello stesso spirito del "Verify dist" di build.yml: un archivio vuoto o mai creato
          # dev'essere un errore, non un allegato inutile pubblicato in silenzio.
          test -s "${name}-dist.zip" || { echo "::error::${name}-dist.zip non è stato creato."; exit 1; }
          sha256sum "${name}-dist.zip" > SHA256SUMS
          echo "OK: ${name}-dist.zip ($(du -h "${name}-dist.zip" | cut -f1))"
          cat SHA256SUMS

      # body_path + generate_release_notes insieme: la sezione curata del CHANGELOG apre la
      # pagina, sotto GitHub aggiunge il proprio elenco generato.
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: |
            openapi-visual-editor-*-dist.zip
            SHA256SUMS
