name: Docker image

# Workflow riutilizzabile: è l'UNICO punto in cui l'immagine viene costruita.
# Lo chiamano manual-build.yml (costruzione di prova, SENZA push) e deploy.yml (rilascio su
# tag, con push su GHCR), così quello che si pubblica è esattamente ciò che si è già provato.
#
# A differenza del sito, qui la compilazione dell'app avviene dentro il Dockerfile e non in
# build.yml: la scelta è spiegata nel Dockerfile stesso (un'immagine dev'essere ricostruibile
# da chi la riceve, non solo dalla CI).
#
# Prerequisito una tantum, manuale: dopo il PRIMO push il package nasce privato.
# Settings -> Packages -> openapi-visual-editor -> Package settings -> Change visibility ->
# Public. Finché resta privato, `docker pull` chiede l'autenticazione e consuma la quota
# storage dell'account, mentre i package pubblici sono gratuiti e illimitati.
on:
  workflow_call:
    inputs:
      push:
        description: >-
          true = pubblica l'immagine su ghcr.io (richiede `packages: write` dal chiamante);
          false = costruisce e basta, per verificare che il Dockerfile funzioni.
        type: boolean
        default: false

# Nessun blocco `permissions`, per lo stesso motivo di build.yml: un workflow riutilizzabile
# eredita i permessi del chiamante e può solo ridurli. Chi chiama con push: true deve
# concedergli `packages: write`.

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Buildx serve per le immagini multi-architettura. Niente setup-qemu-action: lo stage
      # che compila gira sull'architettura del runner (--platform=$BUILDPLATFORM nel
      # Dockerfile) e quello finale esegue solo COPY, quindi non c'è nulla da emulare.
      - uses: docker/setup-buildx-action@v4

      # Il login avviene solo quando si pubblica davvero: una build di prova non ha bisogno
      # di credenziali. Basta il GITHUB_TOKEN, non c'è alcun secret da creare.
      - name: Login su GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Da un tag v1.3.0 escono i tag immagine 1.3.0, 1.3 e latest; da un branch, il nome del
      # branch — che compare solo nelle build di prova, quelle che non pubblicano.
      - name: Tag ed etichette dell'immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest gestito esplicitamente qui sotto, invece che dall'automatismo di default.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=OpenAPI Visual Editor
            org.opencontainers.image.description=Editor visuale per specifiche Swagger 2.0 e OpenAPI 3.x, interamente lato browser
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          # x86 a 32 e 64 bit, ARM a 32 e 64 bit: armv7 copre Raspberry Pi 2/3/4 con sistema
          # a 32 bit, molti SBC e i NAS ARM meno recenti; armv6 copre Pi 1, Zero e Zero W.
          # È anche tutto ciò che il progetto può offrire su base Alpine: nginx:alpine
          # pubblica anche ppc64le, s390x e riscv64, ma non le chiede nessuno.
          # Aggiungerne non allunga la build: lo stage che compila gira una volta sola sul
          # runner, e i cinque stage finali si limitano a copiarne il risultato.
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # La cache di Actions rende le ricostruzioni successive quasi istantanee finché
          # package-lock.json non cambia (per i repository pubblici è gratuita).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestazioni di provenienza e SBOM: dicono da quale workflow e da quale commit
          # nasce l'immagine. GHCR le elenca come voci "unknown/unknown" accanto alle due
          # architetture reali — è normale, non sono immagini rotte.
          provenance: ${{ inputs.push && 'mode=max' || false }}
          sbom: ${{ inputs.push }}
